# Application
spring.application.name=DesignStudio Backend
server.port=8080

# Database (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/design_studio_crm?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Static resources
spring.web.resources.static-locations=file:uploads/
spring.mvc.static-path-pattern=/uploads/**

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.designstudio=INFO
logging.level.org.hibernate.SQL=WARN

# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://localhost:5501,http://127.0.0.1:5500,http://127.0.0.1:5501

# JWT
app.jwt.secret=MySuperSecretKeyForDesignStudioApplication2024VeryLongAndSecureKeyForHS512Algorithm
app.jwt.expiration=86400000
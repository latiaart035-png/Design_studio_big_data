<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Каталог - Design Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="src/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    .logo-img-footer {
      height: 150px;
      width: auto;
      transition: opacity 0.3s ease;
    }
    .logo-img-footer:hover { opacity: 0.8; }
    .logo-img {
      height: 60px;
      width: auto;
      transition: opacity 0.3s ease;
    }
    .logo-img:hover { opacity: 0.8; }

    main.catalog-container {
      max-width: 1400px;
      margin: 2rem auto 4rem;
      padding: 0 1rem;
      display: flex;
      gap: 2rem;
    }

    aside.sidebar {
      width: 220px;
      min-width: 220px;
      background-color: #fff;
      border-radius: 0.5rem;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      padding: 1rem 1.25rem;
      position: sticky;
      top: 80px;
      height: fit-content;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
    }

    aside.sidebar h2 {
      font-family: "Georgia", serif;
      font-weight: 700;
      margin-bottom: 1rem;
      font-size: 1.1rem;
    }

    ul.category-list {
      list-style: none;
      padding-left: 0;
      margin-bottom: 1.5rem;
    }

    ul.category-list li { margin-bottom: 0.4rem; }

    input[type="radio"][name="category"] { display: none; }

    label.category-label {
      cursor: pointer;
      font-weight: 600;
      display: block;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      transition: background-color 0.2s ease;
      font-size: 0.9rem;
    }

    input[type="radio"][name="category"]:checked + label.category-label {
      background-color: #6B1F3F;
      color: #fff;
    }

    .filter-section > label {
      font-weight: 600;
      margin-bottom: 0.25rem;
      display: block;
      font-size: 0.9rem;
    }

    .filter-section input[type="number"],
    .filter-section input[type="text"] {
      width: 100%;
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      border: 1px solid #ced4da;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    #filterForm button[type="submit"] {
      background-color: #6B1F3F;
      border-color: #6B1F3F;
      color: #fff;
      width: 100%;
      font-weight: 600;
      padding: 0.4rem 0;
      border-radius: 0.5rem;
      transition: background-color 0.3s ease;
      font-size: 0.9rem;
    }

    #filterForm button[type="submit"]:hover {
      background-color: #541831;
      border-color: #541831;
    }

    section.products-section { flex: 1; min-width: 0; }

    section.products-section > h1 {
      font-family: "Georgia", serif;
      font-weight: 700;
      font-size: 1.75rem;
      margin-bottom: 1.5rem;
      border-bottom: 2px solid #ddd;
      padding-bottom: 0.5rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
    }

    .product-card {
      background-color: #fff;
      border-radius: 0.75rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: box-shadow 0.3s ease, transform 0.3s ease;
    }

    .product-card:hover {
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transform: translateY(-4px);
    }

    .product-card__image-wrapper {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
    }

    .product-card__image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product-card:hover .product-card__image { transform: scale(1.05); }

    .product-card__badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
      color: #fff;
      padding: 5px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(255, 107, 107, 0.4);
      z-index: 10;
    }

    .product-card__info {
      padding: 0.875rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .product-card__category {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #6B1F3F;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .product-card__name {
      font-family: "Georgia", serif;
      font-size: 0.95rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-card__desc {
      font-size: 0.8rem;
      color: #666;
      line-height: 1.5;
      flex-grow: 1;
      margin-bottom: 10px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-card__price-wrapper { margin-bottom: 10px; }

    .product-card__price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .product-card__price--old {
      font-size: 0.8rem;
      color: #999;
      text-decoration: line-through;
      margin-left: 6px;
      font-weight: 500;
    }

    .product-card__price--new { color: #ff6b6b; }

    .product-card__buttons {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }

    .product-card__btn {
      flex: 1;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .product-card__btn--cart {
      background: linear-gradient(135deg, #6B1F3F 0%, #8B2F5F 100%);
      color: #fff;
    }

    .product-card__btn--cart:hover {
      background: linear-gradient(135deg, #541831 0%, #6B1F3F 100%);
    }

    .product-card__btn--details {
      background: #f1f1f1;
      color: #333;
      border: 1px solid #ddd;
    }

    .product-card__btn--details:hover {
      background: #fff;
      border-color: #6B1F3F;
      color: #6B1F3F;
    }

    .social-icon {
      fill: #f1f1f1;
      width: 32px;
      height: 32px;
      transition: fill 0.3s ease;
    }
    .social-icon:hover { fill: #ccc; }

    /* ==================== DIALOG МОДАЛЬНОЕ ОКНО ==================== */
    :root {
      --accent: #6B1F3F;
      --bg-card: #ffffff;
      --text-main: #1a1a2e;
      --text-muted: #666;
      --radius: 24px;
    }

    #productModal {
      padding: 0;
      border: none;
      border-radius: var(--radius);
      max-width: 900px;
      width: 95%;
      font-family: 'Inter', sans-serif;
      overflow: visible;
      background: transparent;
    }

    #productModal::backdrop {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(8px);
    }

    .modal-wrapper {
      background: var(--bg-card);
      border-radius: var(--radius);
      position: relative;
      overflow: hidden;
    }

    .modal-layout {
      display: flex;
    }

    .modal-image-section {
      flex: 1.2;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      min-height: 450px;
    }

    #modalMainImage {
      transition: opacity 0.3s ease;
    }

    .modal-thumbnail {
      transition: all 0.3s ease;
    }

    /* КОНТЕЙНЕР ДЛЯ ГЛАВНОГО ИЗОБРАЖЕНИЯ С ФИКСИРОВАННЫМ РАЗМЕРОМ */
    .modal-main-image-container {
      width: 100%;
      min-height: 350px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    #modalMainImage {
      max-width: 100%;
      max-height: 350px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.1));
      transition: opacity 0.3s ease;
    }

    .modal-thumbnails {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    .modal-thumbnail {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.7;
      transition: all 0.3s ease;
    }

    .modal-thumbnail:hover {
      opacity: 1;
      transform: scale(1.05);
    }

    .modal-thumbnail.active {
      opacity: 1;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(107, 31, 63, 0.3);
    }

    .modal-info-section {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
    }

    .modal-category {
      color: var(--text-muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 600;
    }

    .modal-title {
      font-family: "Georgia", serif;
      font-size: 28px;
      font-weight: 700;
      margin: 8px 0 16px;
      color: var(--text-main);
      line-height: 1.2;
    }

    .modal-description {
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .modal-price-wrapper {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
    }

    .modal-price {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-main);
    }

    .modal-price--new { color: #ff6b6b; }

    .modal-price--old {
      text-decoration: line-through;
      color: var(--text-muted);
      font-size: 16px;
    }

    .modal-quantity {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .modal-quantity label {
      font-weight: 600;
      color: var(--text-main);
    }

    .modal-quantity input {
      width: 80px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
    }

    .modal-thumbnails {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-thumbnail {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.6;
      transition: all 0.3s ease;
    }

    .modal-thumbnail:hover {
      opacity: 1;
      border-color: var(--accent);
    }

    .modal-thumbnail.active {
      opacity: 1;
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    .modal-buy-btn {
      flex: 1;
      background: var(--accent);
      color: white;
      border: none;
      padding: 14px 24px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .modal-buy-btn:hover {
      background: #541831;
      transform: scale(1.02);
    }

    .modal-buy-btn:active {
      transform: scale(0.98);
    }

    .modal-close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .modal-close-btn:hover {
      background: #fff;
      transform: scale(1.1);
    }

    @media (max-width: 768px) {
      .modal-layout { flex-direction: column; }
      .modal-image-section { padding: 20px; min-height: 300px; }
      .modal-info-section { padding: 24px; }
    }

    /* Toast уведомления */
    .custom-toast {
        position: fixed;
        top: 20px;
        right: 20px;
        background-color: #28a745;
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        opacity: 0;
        transform: translateY(-20px);
        transition: opacity 0.5s ease, transform 0.5s ease;
        z-index: 1000;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 14px;
        font-weight: 500;
    }
    .custom-toast.show {
        opacity: 1;
        transform: translateY(0);
    }
    .custom-toast.error {
        background-color: #dc3545;
    }
    .custom-toast .close-btn {
        background: none;
        border: none;
        color: white;
        font-size: 18px;
        cursor: pointer;
        margin-left: 10px;
        padding: 0;
        line-height: 1;
    }
  </style>
</head>
<body>

<header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html" class="text-decoration-none">
            <img src="src/images/Лого.png" alt="Design Studio" class="logo-img">
        </a>
        <nav class="d-flex align-items-center justify-content-center flex-grow-1">
            <a href="shop.html" class="text-white me-3 text-decoration-none">МАГАЗИН</a>
            <a href="catalog.html" class="text-white me-3 text-decoration-none">КАТАЛОГ ТОВАРОВ</a>
            <a href="order.html" class="text-white me-3 text-decoration-none">ЗАКАЗ ДИЗАЙНА</a>
            <a href="register.html" class="text-white me-3 text-decoration-none" id="navRegister" style="display: none;">РЕГИСТРАЦИЯ</a>
            
            <!-- ОДИН элемент "ПРОФИЛЬ" - ссылка меняется в зависимости от роли -->
            <a href="profile.html" class="text-white me-3 text-decoration-none" id="navProfile" style="display: none;">ПРОФИЛЬ</a>
            
            <a href="crm.html" class="text-white me-3 text-decoration-none" id="navCrm" style="display: none;">CRM</a>
            <a href="marketing.html" class="text-white me-3 text-decoration-none" id="navMarketing" style="display: none;">МАРКЕТИНГ</a>
            <a href="analytics.html" class="text-white me-3 text-decoration-none" id="navAnalytics" style="display: none;">АНАЛИТИКА</a>
        </nav>
        <div>
            <a href="#" class="text-white text-decoration-none" id="navLogout">ВОЙТИ</a>
        </div>
    </div>
</header>

<main class="catalog-container">
  <aside class="sidebar">
    <h2>Категории</h2>
    <form id="filterForm" method="get" action="catalog.html">
      <ul class="category-list">
        <li>
          <input type="radio" id="category-all" name="category" value="" checked />
          <label for="category-all" class="category-label">Все товары</label>
        </li>
        <li>
          <input type="radio" id="category-1" name="category" value="Гостиная" />
          <label for="category-1" class="category-label">Гостиная</label>
        </li>
        <li>
          <input type="radio" id="category-2" name="category" value="Спальня" />
          <label for="category-2" class="category-label">Спальня</label>
        </li>
        <li>
          <input type="radio" id="category-3" name="category" value="Кухня" />
          <label for="category-3" class="category-label">Кухня</label>
        </li>
        <li>
          <input type="radio" id="category-4" name="category" value="Ванная" />
          <label for="category-4" class="category-label">Ванная</label>
        </li>
        <li>
          <input type="radio" id="category-5" name="category" value="Офис" />
          <label for="category-5" class="category-label">Офис</label>
        </li>
      </ul>
      <div class="filter-section">
        <label for="minPrice">Цена от</label>
        <input type="number" id="minPrice" name="minPrice" min="0" placeholder="0" />
        <label for="maxPrice">Цена до</label>
        <input type="number" id="maxPrice" name="maxPrice" min="0" placeholder="9999" />
        <label for="searchInput">Поиск</label>
        <input type="text" id="searchInput" name="search" placeholder="Введите название" autocomplete="off"/>
      </div>
      <div class="d-flex flex-column gap-2 mt-3">
        <button type="button" id="applyFiltersBtn" class="btn btn-primary w-100">Применить</button>
        <button type="button" id="resetFiltersBtn" class="btn btn-secondary w-100">Сбросить</button>
      </div>
    </form>
  </aside>

  <section class="products-section">
    <h1>Каталог товаров</h1>
    <div class="products-grid" id="productsGrid">
      <!-- Загружается через JS -->
    </div>
    <div id="noProducts" class="text-center mt-5 text-muted" style="display: none;">
      Товары не найдены.
    </div>
  </section>
</main>

<!-- DIALOG МОДАЛЬНОЕ ОКНО -->
<dialog id="productModal">
  <div class="modal-wrapper">
    <button class="modal-close-btn" id="modalCloseBtn">&times;</button>
    <div class="modal-layout">
      <div class="modal-image-section">
        <div class="modal-main-image-container">
            <img id="modalMainImage" src="src/images/default.jpg" alt="Product">
        </div>
        <div class="modal-thumbnails" id="modalThumbnails"></div>
      </div>
      <div class="modal-info-section">
        <span class="modal-category" id="modalCategory"></span>
        <h2 class="modal-title" id="modalTitle"></h2>
        <p class="modal-description" id="modalDescription"></p>
        <div class="modal-price-wrapper" id="modalPrice"></div>
        <div class="modal-quantity">
          <label for="modalQuantity">Количество:</label>
          <input type="number" id="modalQuantity" value="1" min="1">
        </div>
        <div class="modal-actions">
          <button class="modal-buy-btn" id="modalAddToCart">Добавить в корзину</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="d-flex align-items-center mb-4">
                    <a href="index.html" class="text-decoration-none">
                        <img src="src/images/Лого.png" alt="Design Studio" class="logo-img-footer">

            </div>
            <div class="col-md-3">

                <ul class="list-unstyled">

                    <li><a href="catalog.html?category=Спальня" class="text-white text-decoration-none">Спальня</a></li>
                    <li><a href="catalog.html?category=Кухня" class="text-white text-decoration-none">Кухня</a></li>
                    <li><a href="catalog.html?category=Офис" class="text-white text-decoration-none">Офис</a></li>
                </ul>
            </div>
            <div class="col-md-3">
                <h5>ЗАКАЗ ДИЗАЙНА</h5>

                    <li><a href="order.html" class="text-white text-decoration-none">Заказать</a></li>
                    <li><a href="order.html" class="text-white text-decoration-none">Как это работает?</a></li>
                </ul>
            </div>
            <div class="col-md-3">
                <h5 class="text-center">ПОДПИСЫВАЙТЕСЬ НА НАШИ СОЦИАЛЬНЫЕ СЕТИ</h5>
                <div class="d-flex justify-content-center">
                    <a href="https://pinterest.com" class="text-white me-3 text-decoration-none">

                        </svg>
                    </a>

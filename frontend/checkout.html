<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Оформление заказа - Design Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="src/css/styles.css">
  <style>
    .logo-img-footer { height: 150px; width: auto; }
    .logo-img { height: 60px; width: auto; }

    .checkout-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .checkout-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .checkout-header {
      background: linear-gradient(135deg, #6B1F3F 0%, #8B2F5F 100%);
      color: white;
      padding: 2rem;
      text-align: center;
    }

    .checkout-body {
      padding: 2rem;
    }

    .cart-items-list {
      max-height: 300px;
      overflow-y: auto;
    }

    .cart-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem;
      border-bottom: 1px solid #f0f0f0;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item-image {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      background: #f5f5f5;
    }

    .cart-item-info {
      flex-grow: 1;
    }

    .cart-item-name {
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    .cart-item-price {
      color: #666;
      font-size: 0.9rem;
    }

    .cart-item-qty {
      color: #999;
      font-size: 0.85rem;
    }

    .cart-item-total {
      font-weight: 700;
      color: #6B1F3F;
      font-size: 1.1rem;
      min-width: 100px;
      text-align: right;
    }

    .order-summary {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 1.5rem;
      margin-top: 1.5rem;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      font-size: 1rem;
    }

    .summary-row:last-child {
      margin-bottom: 0;
      padding-top: 0.75rem;
      border-top: 2px solid #e0e0e0;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .discount-row {
      color: #28a745;
    }

    .discount-row .summary-value {
      color: #28a745;
    }

    .form-section {
      margin-top: 2rem;
    }

    .form-section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #333;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      .form-row {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      display: block;
    }

    .form-control {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 1rem;
    }

    .form-control:focus {
      border-color: #6B1F3F;
      box-shadow: 0 0 0 3px rgba(107, 31, 63, 0.1);
    }

    .submit-section {
      padding: 1.5rem 2rem 2rem;
      background: #f8f9fa;
      border-top: 1px solid #e0e0e0;
    }

    .submit-btn {
      width: 100%;
      padding: 1rem;
      background: linear-gradient(135deg, #6B1F3F 0%, #8B2F5F 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(107, 31, 63, 0.3);
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .user-discount-badge {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .custom-toast {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: translateY(-20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
      z-index: 1000;
    }

    .custom-toast.show { opacity: 1; transform: translateY(0); }
    .custom-toast.error { background-color: #dc3545; }
  </style>
</head>
<body>
<header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="index.html" class="text-decoration-none">
            <img src="src/images/Лого.png" alt="Design Studio" class="logo-img">
        </a>
        <nav class="d-flex align-items-center justify-content-center flex-grow-1">
            <a href="shop.html" class="text-white me-3 text-decoration-none">МАГАЗИН</a>
            <a href="catalog.html" class="text-white me-3 text-decoration-none">КАТАЛОГ ТОВАРОВ</a>
            <a href="order.html" class="text-white me-3 text-decoration-none">ЗАКАЗ ДИЗАЙНА</a>
            <a href="register.html" class="text-white me-3 text-decoration-none" id="navRegister" style="display: none;">РЕГИСТРАЦИЯ</a>
            
            <!-- ОДИН элемент "ПРОФИЛЬ" - ссылка меняется в зависимости от роли -->
            <a href="profile.html" class="text-white me-3 text-decoration-none" id="navProfile" style="display: none;">ПРОФИЛЬ</a>
            
            <a href="crm.html" class="text-white me-3 text-decoration-none" id="navCrm" style="display: none;">CRM</a>
            <a href="marketing.html" class="text-white me-3 text-decoration-none" id="navMarketing" style="display: none;">МАРКЕТИНГ</a>
            <a href="analytics.html" class="text-white me-3 text-decoration-none" id="navAnalytics" style="display: none;">АНАЛИТИКА</a>
        </nav>
        <div>
            <a href="#" class="text-white text-decoration-none" id="navLogout">ВОЙТИ</a>
        </div>
    </div>
</header>

<div class="checkout-container">
  <div class="checkout-card">
    <div class="checkout-header">
      <h1><i class="bi bi-cart-check"></i> Оформление заказа</h1>
      <p id="discountInfo"></p>
    </div>
    
    <div class="checkout-body">
      <!-- Список товаров -->
      <div class="cart-items-list" id="cartItemsContainer">
        <div class="text-center p-5">
          <i class="bi bi-hourglass-split" style="font-size: 2rem; color: #ccc;"></i>
          <p class="mt-2 text-muted">Загрузка корзины...</p>
        </div>
      </div>
      
      <!-- Итого -->
      <div class="order-summary" id="orderSummary" style="display: none;">
        <div class="summary-row">
          <span>Товары:</span>
          <span class="summary-value" id="summarySubtotal">0 BYN</span>
        </div>
        <div class="summary-row discount-row" id="discountRow" style="display: none;">
          <span>Ваша скидка (<span id="discountPercent">0</span>%):</span>
                    <span class="summary-value" id="summaryDiscount">-0 BYN</span>
        </div>
        <div class="summary-row">
          <span>Доставка:</span>
          <span class="summary-value">Бесплатно</span>
        </div>
        <div class="summary-row">
          <strong>Итого к оплате:</strong>
          <strong class="summary-value" id="summaryTotal" style="color: #6B1F3F;">0 BYN</strong>
        </div>
      </div>
      
      <!-- Форма оплаты -->
      <div class="form-section">
        <h3 class="form-section-title">
          <i class="bi bi-credit-card"></i> Оплата
        </h3>
        <form id="checkoutForm">
          <div class="form-group">
            <label class="form-label">Адрес доставки</label>
            <input type="text" class="form-control" name="address" required placeholder="Город, улица, дом, квартира">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">Номер карты</label>
              <input type="text" class="form-control" name="cardNumber" required placeholder="0000 0000 0000 0000" maxlength="19">
            </div>
            <div class="form-group">
              <label class="form-label">Срок действия</label>
              <input type="text" class="form-control" name="expiry" required placeholder="ММ/ГГ" maxlength="5">
            </div>
            <div class="form-group">
              <label class="form-label">CVC</label>
              <input type="text" class="form-control" name="cvc" required placeholder="000" maxlength="3">
            </div>
          </div>
        </form>
      </div>
    </div>
    
    <div class="submit-section">
      <button type="submit" form="checkoutForm" class="submit-btn" id="submitBtn">
        <i class="bi bi-check-circle"></i> Подтвердить заказ
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="src/js/checkout.js"></script>
</body>
</html>
